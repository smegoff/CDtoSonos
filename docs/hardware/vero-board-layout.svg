<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="980" viewBox="0 0 1450 980" role="img" aria-labelledby="title desc">
  <title id="title">Suggested 18 by 14 hole CDtoSonos vero-board layout</title>
  <desc id="desc">Component-side stripboard layout showing a DIP20 74LVC245 socket, three series resistors, track cuts, power, ground, NAD input pads and Heltec output pads.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="8" fill="#6b4c28" stroke="#2c241d" stroke-width="2"/>
    </pattern>
    <style>
      .bg{fill:#efe8db}.board{fill:#d4b078;stroke:#3d3023;stroke-width:4}.track{stroke:#a86f2d;stroke-width:13;opacity:.55}
      .txt{font:20px Arial,sans-serif;fill:#2c241d}.tiny{font:16px Arial,sans-serif;fill:#504538}.label{font:bold 22px Arial,sans-serif;fill:#2c241d}.title{font:bold 34px Arial,sans-serif;fill:#2c241d}
      .chip{fill:#242424;stroke:#090909;stroke-width:3}.socket{fill:none;stroke:#e5ddd0;stroke-width:4}.pin{fill:#d7d1c5;stroke:#111;stroke-width:2}
      .cut{fill:#f5eee2;stroke:#b52323;stroke-width:5}.jumper{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .red{stroke:#c5372e}.black{stroke:#202020}.blue{stroke:#1477c9}.white{stroke:#fffdf7}.yellow{stroke:#e6b800}.green{stroke:#18834b}.grey{stroke:#67605a}
      .res{fill:#e5c88f;stroke:#3b3025;stroke-width:3}.pad{stroke:#f7f1e8;stroke-width:3}.note{fill:#fff7e8;stroke:#7d603c;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1450" height="980"/>
  <text class="title" x="725" y="48" text-anchor="middle">Suggested vero-board daughterboard · component side</text>
  <text class="txt" x="725" y="80" text-anchor="middle">18 columns × 14 rows · copper strips run horizontally · red rings are copper-side cuts</text>

  <!-- board and horizontal copper strips -->
  <rect class="board" x="155" y="105" width="1080" height="840" rx="12"/>
  <g>
    <path class="track" d="M170 135H1220"/><path class="track" d="M170 195H1220"/><path class="track" d="M170 255H1220"/>
    <path class="track" d="M170 315H1220"/><path class="track" d="M170 375H1220"/><path class="track" d="M170 435H1220"/>
    <path class="track" d="M170 495H1220"/><path class="track" d="M170 555H1220"/><path class="track" d="M170 615H1220"/>
    <path class="track" d="M170 675H1220"/><path class="track" d="M170 735H1220"/><path class="track" d="M170 795H1220"/>
    <path class="track" d="M170 855H1220"/><path class="track" d="M170 915H1220"/>
  </g>
  <rect x="155" y="105" width="1080" height="840" fill="url(#grid)" opacity=".85"/>

  <!-- row and column labels -->
  <g class="tiny">
    <text x="125" y="141" text-anchor="end">1 · 3V3 bus</text><text x="125" y="201" text-anchor="end">2</text>
    <text x="125" y="261" text-anchor="end">3 · pins 1/20</text><text x="125" y="321" text-anchor="end">4 · pins 2/19</text>
    <text x="125" y="381" text-anchor="end">5 · pins 3/18</text><text x="125" y="441" text-anchor="end">6 · pins 4/17</text>
    <text x="125" y="501" text-anchor="end">7 · pins 5/16</text><text x="125" y="561" text-anchor="end">8 · pins 6/15</text>
    <text x="125" y="621" text-anchor="end">9 · pins 7/14</text><text x="125" y="681" text-anchor="end">10 · pins 8/13</text>
    <text x="125" y="741" text-anchor="end">11 · pins 9/12</text><text x="125" y="801" text-anchor="end">12 · pins 10/11</text>
    <text x="125" y="861" text-anchor="end">13</text><text x="125" y="921" text-anchor="end">14 · GND bus</text>
    <text x="185" y="970">1</text><text x="485" y="970">6</text><text x="725" y="970">10</text>
    <text x="905" y="970">13</text><text x="1205" y="970">18</text>
  </g>

  <!-- DIP socket -->
  <rect class="chip" x="716" y="236" width="198" height="588" rx="12"/>
  <rect class="socket" x="730" y="250" width="170" height="560" rx="7"/>
  <path d="M770 236a45 30 0 0 0 90 0" fill="#d4b078"/>
  <circle cx="750" cy="270" r="9" fill="#f1d248"/>
  <text x="815" y="535" text-anchor="middle" transform="rotate(-90 815 535)" style="font:bold 26px Arial,sans-serif;fill:#f4eee5">74LVC245 · DIP-20</text>

  <!-- pins at columns 10 and 13 -->
  <g>
    <circle class="pin" cx="725" cy="255" r="12"/><circle class="pin" cx="905" cy="255" r="12"/>
    <circle class="pin" cx="725" cy="315" r="12"/><circle class="pin" cx="905" cy="315" r="12"/>
    <circle class="pin" cx="725" cy="375" r="12"/><circle class="pin" cx="905" cy="375" r="12"/>
    <circle class="pin" cx="725" cy="435" r="12"/><circle class="pin" cx="905" cy="435" r="12"/>
    <circle class="pin" cx="725" cy="495" r="12"/><circle class="pin" cx="905" cy="495" r="12"/>
    <circle class="pin" cx="725" cy="555" r="12"/><circle class="pin" cx="905" cy="555" r="12"/>
    <circle class="pin" cx="725" cy="615" r="12"/><circle class="pin" cx="905" cy="615" r="12"/>
    <circle class="pin" cx="725" cy="675" r="12"/><circle class="pin" cx="905" cy="675" r="12"/>
    <circle class="pin" cx="725" cy="735" r="12"/><circle class="pin" cx="905" cy="735" r="12"/>
    <circle class="pin" cx="725" cy="795" r="12"/><circle class="pin" cx="905" cy="795" r="12"/>
  </g>

  <!-- IC isolation cuts at column 11 -->
  <g>
    <circle class="cut" cx="785" cy="255" r="16"/><circle class="cut" cx="785" cy="315" r="16"/>
    <circle class="cut" cx="785" cy="375" r="16"/><circle class="cut" cx="785" cy="435" r="16"/>
    <circle class="cut" cx="785" cy="495" r="16"/><circle class="cut" cx="785" cy="555" r="16"/>
    <circle class="cut" cx="785" cy="615" r="16"/><circle class="cut" cx="785" cy="675" r="16"/>
    <circle class="cut" cx="785" cy="735" r="16"/><circle class="cut" cx="785" cy="795" r="16"/>
  </g>

  <!-- input series cuts col 6 -->
  <circle class="cut" cx="485" cy="315" r="16"/><circle class="cut" cx="485" cy="375" r="16"/><circle class="cut" cx="485" cy="435" r="16"/>

  <!-- input resistors bridge cuts -->
  <path class="jumper blue" d="M365 315H425"/><rect class="res" x="425" y="296" width="120" height="38" rx="8"/><text class="tiny" x="485" y="321" text-anchor="middle">1 kΩ</text><path class="jumper blue" d="M545 315H725"/>
  <path class="jumper white" d="M365 375H425"/><rect class="res" x="425" y="356" width="120" height="38" rx="8"/><text class="tiny" x="485" y="381" text-anchor="middle">1 kΩ</text><path class="jumper white" d="M545 375H725"/>
  <path class="jumper yellow" d="M365 435H425"/><rect class="res" x="425" y="416" width="120" height="38" rx="8"/><text class="tiny" x="485" y="441" text-anchor="middle">1 kΩ</text><path class="jumper yellow" d="M545 435H725"/>
  <path d="M485 288v-20m-8 8 8-8 8 8" fill="none" stroke="#b52323" stroke-width="4"/>
  <path d="M485 348v-20m-8 8 8-8 8 8" fill="none" stroke="#b52323" stroke-width="4"/>
  <path d="M485 408v-20m-8 8 8-8 8 8" fill="none" stroke="#b52323" stroke-width="4"/>
  <text class="tiny" x="510" y="274" fill="#b52323">CUT below each resistor</text>

  <!-- NAD connection pads -->
  <circle class="pad" cx="245" cy="315" r="15" fill="#1477c9"/><text class="label" x="270" y="302">BLUE</text><text class="tiny" x="270" y="323">U302 pin 3 · BCLK</text>
  <circle class="pad" cx="245" cy="375" r="15" fill="#fffdf7"/><text class="label" x="270" y="365">WHITE</text><text class="tiny" x="270" y="386">U302 pin 1 · LRCLK</text>
  <circle class="pad" cx="245" cy="435" r="15" fill="#e6b800"/><text class="label" x="270" y="425">YELLOW</text><text class="tiny" x="270" y="446">U302 pin 2 · DATA</text>
  <circle class="pad" cx="245" cy="915" r="15" fill="#202020"/><text class="label" x="270" y="906">BLACK</text><text class="tiny" x="270" y="927">U302 pin 7 · DGND</text>

  <!-- Heltec connection pads -->
  <circle class="pad" cx="1145" cy="135" r="15" fill="#18834b"/><text class="label" x="1115" y="123" text-anchor="end">Heltec 3V3</text>
  <circle class="pad" cx="1145" cy="375" r="15" fill="#1477c9"/><text class="label" x="1115" y="356" text-anchor="end">GPIO 4 · BCLK</text>
  <circle class="pad" cx="1145" cy="435" r="15" fill="#fffdf7"/><text class="label" x="1115" y="416" text-anchor="end">GPIO 5 · LRCLK</text>
  <circle class="pad" cx="1145" cy="495" r="15" fill="#e6b800"/><text class="label" x="1115" y="476" text-anchor="end">GPIO 6 · DATA</text>
  <circle class="pad" cx="1145" cy="915" r="15" fill="#202020"/><text class="label" x="1115" y="895" text-anchor="end">Heltec GND</text>

  <!-- output wires on their row segments -->
  <path class="jumper blue" d="M905 375H1145"/><path class="jumper white" d="M905 435H1145"/><path class="jumper yellow" d="M905 495H1145"/>

  <!-- power jumpers: row 1 bus to pins 1 and 20, bridge DIR/VCC -->
  <path class="jumper green" d="M725 255V135H1145M905 255V135M725 255H905"/>
  <text class="tiny" x="815" y="226" text-anchor="middle">DIR high · A → B</text>

  <!-- /OE and grounds -->
  <path class="jumper black" d="M905 315H965V915"/>
  <path class="jumper black" d="M725 495V795"/>
  <path class="jumper black" d="M725 795V915H1145"/>
  <text class="tiny" x="650" y="600" text-anchor="end">Bare link grounds</text><text class="tiny" x="650" y="621" text-anchor="end">A4–A8 and pin 10</text>
  <text class="tiny" x="990" y="327">/OE low</text>

  <!-- 100nF across pin20/pin19 -->
  <path class="jumper red" d="M935 255H955M955 244V266M970 244V266M970 315H935"/>
  <text class="tiny" x="990" y="270">100 nF</text><text class="tiny" x="990" y="290">pins 20 ↔ 19</text>

  <rect class="note" x="1248" y="115" width="180" height="290" rx="12"/>
  <text class="label" x="1338" y="150" text-anchor="middle">Copper cuts</text>
  <circle class="cut" cx="1285" cy="190" r="16"/><text class="txt" x="1315" y="197">10 under IC</text>
  <circle class="cut" cx="1285" cy="235" r="16"/><text class="txt" x="1315" y="242">3 inputs</text>
  <text class="tiny" x="1268" y="285">Drill/cut copper</text><text class="tiny" x="1268" y="307">on the underside.</text>
  <text class="tiny" x="1268" y="345">Check every cut</text><text class="tiny" x="1268" y="367">with continuity mode.</text>

  <rect class="note" x="1248" y="440" width="180" height="260" rx="12"/>
  <text class="label" x="1338" y="475" text-anchor="middle">Orientation</text>
  <text class="tiny" x="1268" y="515">IC dot/notch at top.</text>
  <text class="tiny" x="1268" y="550">Copper is behind</text><text class="tiny" x="1268" y="572">this drawing.</text>
  <text class="tiny" x="1268" y="615">Use a socket and</text><text class="tiny" x="1268" y="637">insulated standoffs.</text>
  <text class="tiny" x="1268" y="675">Do not connect D+5V.</text>
</svg>
