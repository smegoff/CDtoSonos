[platformio]
default_envs = heltec-v3
src_dir = main

[env:heltec-v3]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
build_flags =
    -DCDTS_FIRMWARE_VERSION=\"0.1.5\"
    -DCDTS_LORA_ENABLED=0
    -Wall
    -Wextra
    -Werror=return-type
