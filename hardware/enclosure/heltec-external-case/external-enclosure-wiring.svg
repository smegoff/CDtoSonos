<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f2ed"/>
      <stop offset="1" stop-color="#c8c7c1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a43a"/>
      <stop offset="0.5" stop-color="#ffd270"/>
      <stop offset="1" stop-color="#de8b24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".22"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #202124; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5d6065; }
      .section { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; }
      .note { font-size: 15px; fill: #5c4a24; }
      .pin { fill: #fff; stroke: #17191d; stroke-width: 2; }
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; }
      text[fill="#fff"] { fill: #fff; }
      text[fill="#dfe9eb"] { fill: #dfe9eb; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f7f5ef"/>
  <text x="60" y="58" class="title">CDtoSonos external enclosure wiring</text>
  <text x="60" y="88" class="subtitle">NAD C541i native PCM • short screened lead • external Heltec carrier • USB-C power</text>

  <!-- NAD -->
  <rect x="55" y="125" width="340" height="555" rx="22" fill="url(#case)" stroke="#777a7e" stroke-width="3" filter="url(#shadow)"/>
  <text x="85" y="170" class="section">NAD C541i</text>
  <rect x="95" y="205" width="220" height="215" rx="12" fill="#1678a5" stroke="#095a7f" stroke-width="3"/>
  <text x="120" y="242" class="label" fill="#fff">U302 PCM1732U</text>
  <circle cx="118" cy="273" r="7" fill="#121417"/>
  <text x="138" y="279" class="small" fill="#fff">pin-1 dot</text>
  <circle cx="275" cy="305" r="10" class="pin"/><text x="270" y="311" class="small">1</text>
  <circle cx="275" cy="345" r="10" class="pin"/><text x="270" y="351" class="small">2</text>
  <circle cx="275" cy="385" r="10" class="pin"/><text x="270" y="391" class="small">3</text>
  <circle cx="150" cy="385" r="10" class="pin"/><text x="145" y="391" class="small">7</text>
  <text x="294" y="311" class="small" fill="#fff">LRCLK</text>
  <text x="294" y="351" class="small" fill="#fff">DATA</text>
  <text x="294" y="391" class="small" fill="#fff">BCLK</text>
  <text x="102" y="391" class="small" fill="#fff">DGND</text>

  <rect x="105" y="485" width="235" height="112" rx="10" fill="#2c2f34" stroke="#111" stroke-width="3"/>
  <text x="122" y="519" class="label" fill="#fff">PP2010 panel connector</text>
  <circle cx="145" cy="557" r="14" class="pin"/><text x="140" y="563" class="label">1</text>
  <circle cx="195" cy="557" r="14" class="pin"/><text x="190" y="563" class="label">2</text>
  <circle cx="245" cy="557" r="14" class="pin"/><text x="240" y="563" class="label">3</text>
  <circle cx="295" cy="557" r="14" class="pin"/><text x="290" y="563" class="label">4</text>
  <line x1="130" y1="625" x2="315" y2="625" stroke="#4c4f52" stroke-width="4"/>
  <path d="M222 625 v28 m-20 0 h40 m-32 10 h24 m-17 10 h10" fill="none" stroke="#4c4f52" stroke-width="4"/>
  <text x="91" y="650" class="small">Screen bonded to NAD chassis here only</text>

  <!-- cable -->
  <rect x="415" y="250" width="425" height="300" rx="95" fill="#34373b" stroke="#1c1e21" stroke-width="4"/>
  <text x="485" y="292" class="section" fill="#fff">WB1510 screened cable</text>
  <text x="505" y="522" class="small" fill="#fff">Start at 150 mm • test only up to 300 mm</text>
  <path d="M445 340 H810" class="wire" stroke="#2477d4"/>
  <path d="M445 385 H810" class="wire" stroke="#f1f1ed"/>
  <path d="M445 430 H810" class="wire" stroke="#e4ae25"/>
  <path d="M445 475 H810" class="wire" stroke="#15171a"/>
  <path d="M450 315 C540 300 715 300 805 315" fill="none" stroke="url(#screen)" stroke-width="5" stroke-dasharray="9 8"/>
  <text x="560" y="337" class="small" fill="#fff">1 BCLK</text>
  <text x="560" y="382" class="small">2 LRCLK</text>
  <text x="560" y="427" class="small">3 DATA</text>
  <text x="560" y="472" class="small" fill="#fff">4 DGND</text>
  <text x="585" y="317" class="small" fill="#fff">screen</text>

  <!-- external enclosure -->
  <rect x="860" y="125" width="485" height="555" rx="22" fill="url(#case)" stroke="#777a7e" stroke-width="3" filter="url(#shadow)"/>
  <text x="900" y="170" class="section">External printed enclosure</text>
  <rect x="915" y="205" width="375" height="98" rx="10" fill="#d28a29" stroke="#8c5517" stroke-width="3"/>
  <text x="952" y="244" class="label">Visible Heltec OLED</text>
  <rect x="1125" y="222" width="125" height="55" rx="5" fill="#101820" stroke="#333" stroke-width="4"/>
  <text x="1140" y="247" class="small" fill="#dfe9eb">44.1 kHz FLAC</text>
  <text x="1140" y="268" class="small" fill="#dfe9eb">Sonos: Playing</text>

  <rect x="915" y="335" width="375" height="170" rx="12" fill="#17814d" stroke="#0c5b35" stroke-width="3"/>
  <text x="942" y="372" class="label" fill="#fff">Revision-A carrier PCB</text>
  <rect x="965" y="397" width="155" height="78" rx="7" fill="#25282c" stroke="#111" stroke-width="2"/>
  <text x="990" y="429" class="small" fill="#fff">SN74LVC245</text>
  <text x="990" y="452" class="small" fill="#fff">+ 1 kΩ inputs</text>
  <rect x="1150" y="397" width="105" height="78" rx="7" fill="#e4e5e6" stroke="#777" stroke-width="2"/>
  <text x="1163" y="429" class="small">Heltec V3</text>
  <text x="1163" y="452" class="small">ESP32-S3</text>

  <rect x="885" y="530" width="180" height="92" rx="10" fill="#2c2f34" stroke="#111" stroke-width="3"/>
  <text x="905" y="558" class="small" fill="#fff">PP2010 plate</text>
  <circle cx="915" cy="590" r="11" class="pin"/><text x="911" y="595" class="small">1</text>
  <circle cx="955" cy="590" r="11" class="pin"/><text x="951" y="595" class="small">2</text>
  <circle cx="995" cy="590" r="11" class="pin"/><text x="991" y="595" class="small">3</text>
  <circle cx="1035" cy="590" r="11" class="pin"/><text x="1031" y="595" class="small">4</text>

  <rect x="1120" y="548" width="172" height="62" rx="10" fill="#383b40" stroke="#111" stroke-width="3"/>
  <rect x="1256" y="564" width="46" height="30" rx="7" fill="#17191d"/>
  <text x="1140" y="584" class="label" fill="#fff">USB-C 5 V</text>
  <path d="M1302 579 H1350" stroke="#383b40" stroke-width="12" stroke-linecap="round"/>

  <!-- connection end lines -->
  <path d="M340 557 H405" stroke="#565a60" stroke-width="18" stroke-linecap="round"/>
  <path d="M840 557 H885" stroke="#565a60" stroke-width="18" stroke-linecap="round"/>

  <!-- warning -->
  <rect x="80" y="720" width="1240" height="65" rx="12" fill="#fff0c9" stroke="#d69b21" stroke-width="2"/>
  <text x="105" y="748" class="note">Prototype cable, not a guaranteed long digital interconnect. Use pin numbers, continuity-test every core, keep pin 4 as DGND,</text>
  <text x="105" y="772" class="note">and reject the installation if PCM unlocks, bad sample rate, overruns, dropouts or channel corruption appear.</text>
</svg>
